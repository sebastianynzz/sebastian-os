name: CI

on:
  pull_request:
    branches: [main, "integration/**"]
  push:
    branches: [main]

# Cancela ejecuciones anteriores del mismo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moveos
          POSTGRES_PASSWORD: moveos
          POSTGRES_DB: moveos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moveos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://moveos:moveos@localhost:5432/moveos

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (fail on high/critical CVEs)
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm --filter @moveos/api db:generate

      - name: Apply migrations (fresh DB — proves migrations are valid)
        run: pnpm --filter @moveos/api db:migrate:deploy

      - name: Typecheck + build all packages
        run: pnpm -r build

      - name: Run tests (optimizer units + API e2e)
        run: pnpm -r test
