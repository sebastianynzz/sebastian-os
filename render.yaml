# Despliegue de la API MoveOS en Render (un comando: render blueprint launch).
# Las UIs (web, admin) van en Vercel/Cloudflare Pages; la base en Supabase/Neon.
services:
  - type: web
    name: moveos-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto fuerte
      - key: DATABASE_URL
        sync: false # pega aquí la URL de Supabase/Neon
      - key: CORS_ORIGINS
        sync: false # p.ej. https://app.moveos.co,https://admin.moveos.co
      - key: WHATSAPP_BUSINESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
