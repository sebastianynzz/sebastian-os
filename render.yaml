# Despliegue de la API MoveOS en Render.
# Uso: dashboard de Render → New + → Blueprint → conectar este repo,
# o CLI: `render blueprint launch` desde la raíz del repo.
# Las UIs (web, driver, admin) van en Vercel; la base de datos en Supabase.
services:
  - type: web
    name: moveos-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter # ~US$7/mes; "free" también sirve (se duerme tras inactividad)
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto fuerte automáticamente
      - key: DATABASE_URL
        sync: false # Supabase → Connect → "Session pooler" URI (IPv4, puerto 5432)
      - key: CORS_ORIGINS
        sync: false # luego del deploy en Vercel: https://app...,https://conductor...,https://admin...
      - key: SUPABASE_URL
        value: https://mervcbeedbcruqcipuvr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase → Settings → API → service_role (secreto)
      - key: SUPABASE_STORAGE_BUCKET
        value: pod-photos
      - key: WHATSAPP_BUSINESS_TOKEN
        sync: false # opcional: vacío hasta tener credenciales BSP
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false # opcional
      - key: ANTHROPIC_API_KEY
        sync: false # Copiloto IA (módulo AI_ADDONS); vacío = Copiloto deshabilitado
      - key: COPILOT_MODEL
        value: claude-haiku-4-5 # P0.1: control de gasto del Copiloto en producción
      - key: LUPAP_API_KEY
        sync: false # opcional: geocodificador colombiano en la cascada
      - key: GOOGLE_MAPS_API_KEY
        sync: false # opcional: fallback premium de geocodificación
      - key: SENDGRID_API_KEY
        sync: false # opcional: canal EMAIL de notificaciones B2B
      - key: EMAIL_FROM
        sync: false # remitente verificado en SendGrid
      - key: VAPID_PUBLIC_KEY
        sync: false # web push (npx web-push generate-vapid-keys); vacío = sin push
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:ops@moveos.co
      - key: SENTRY_DSN
        sync: false # P0.7 observabilidad (Sentry free); vacío = solo logs
      - key: OSRM_URL
        sync: false # poner http://moveos-osrm:5000 al aprobar el servicio de abajo; vacío = haversine

  # OSRM con el grafo vial de Colombia (P0.4, docs/OSRM_RENDER.md). Servicio
  # PRIVADO: solo la API lo consume por la red interna (http://moveos-osrm:5000).
  # El build descarga y preprocesa el extracto de Geofabrik UNA vez; el mapa
  # cambia poco para logística urbana → autoDeploy off, redeploy manual cada
  # 3-6 meses para refrescar el extracto.
  - type: pserv
    name: moveos-osrm
    runtime: docker
    dockerfilePath: ./infra/osrm/Dockerfile
    dockerContext: ./infra/osrm
    plan: standard # osrm-routed con Colombia usa ~1.5-2 GB de RAM; free no alcanza
    autoDeploy: false
