# Entorno de desarrollo local — base de datos PostgreSQL
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moveos
      POSTGRES_PASSWORD: moveos
      POSTGRES_DB: moveos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
